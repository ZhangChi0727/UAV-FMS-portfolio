name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  development-readiness:
    name: Development-readiness toolchain probe (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/b0-dev.txt

      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ catch2

      - name: Install isolated B0 development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/b0-dev.txt

      - name: Lint the Python binding probe
        run: python -m ruff check tools/development_readiness/python

      - name: Configure, build, and test Debug
        run: |
          cmake --preset development-readiness-debug
          cmake --build --preset development-readiness-debug
          ctest --preset development-readiness-debug

      - name: Configure, build, and test Release
        run: |
          cmake --preset development-readiness-release
          cmake --build --preset development-readiness-release
          ctest --preset development-readiness-release

      - name: Clean and rebuild Debug
        run: |
          cmake --build --preset development-readiness-debug --target clean
          cmake --build --preset development-readiness-debug
          ctest --preset development-readiness-debug

  b0-g0-contracts:
    name: B0 G0 contract validation (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/b0-dev.txt

      - name: Install isolated B0 development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/b0-dev.txt

      - name: Lint B0 G0 contract track
        run: python -m ruff check .
        working-directory: 05_integration/b0

      - name: Validate historical B0 G0 v1 contract
        run: python validate_config.py --config configs/b0_g0_contract.v1.json
        working-directory: 05_integration/b0

      - name: Validate approved B0 G0 v2 contract
        run: python validate_config.py --config configs/b0_g0_contract.v2.json
        working-directory: 05_integration/b0

      - name: Validate default approved B0 G0 contract
        run: python validate_config.py
        working-directory: 05_integration/b0

      - name: Run B0 G0 contract tests
        run: python -m pytest -v
        working-directory: 05_integration/b0

      - name: Check complete PR diff whitespace
        run: git diff --check origin/main...HEAD

  b0-g1-components:
    name: B0 G1 plant actuator IMU components (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/b0-dev.txt

      - name: Install isolated B0 development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/b0-dev.txt

      - name: Lint G1 component track
        run: python -m ruff check .
        working-directory: 01_simulation/b0

      - name: Run G1 component tests
        run: python -m pytest -q tests
        working-directory: 01_simulation/b0

      - name: Emit deterministic component evidence
        run: python evidence.py --output g1_component_evidence.json
        working-directory: 01_simulation/b0

      - name: Upload deterministic component evidence
        uses: actions/upload-artifact@v4
        with:
          name: b0-g1-component-evidence
          path: 01_simulation/b0/g1_component_evidence.json

  navigation-baseline:
    name: Python navigation baseline (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install navigation test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pytest==8.2.0 ruff==0.4.4 black==24.4.2

      - name: Lint navigation track
        run: ruff check . --ignore E501
        working-directory: 02_estimation/python

      - name: Check navigation formatting
        run: black --check tests/test_ekf.py
        working-directory: 02_estimation/python

      - name: Run navigation contract tests
        run: python -m pytest --tb=short -v
        working-directory: 02_estimation/python

  systems-engineering-governance:
    name: G1.5-A systems-engineering governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated B0 test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/b0-dev.txt
          python -m pip install -r requirements/g15b-pilot.txt

      - name: Check migration, model allocation and evidence references
        run: python tools/systems_engineering/check_governance.py

      - name: Check G1.5-C execution evidence and current report
        run: python tools/systems_engineering/check_g15c_traceability.py --check-report --json --html-output "$RUNNER_TEMP/g15c-traceability/index.html"

      - name: Run positive and negative governance fixtures
        run: python -m pytest -q tests
        working-directory: tools/systems_engineering

      - name: Upload G1.5-C reader report
        uses: actions/upload-artifact@v4
        with:
          name: b0-g15c-traceability-report
          path: ${{ runner.temp }}/g15c-traceability

  g15b-phase-one-pilot:
    name: G1.5-B phase-one requirements pilot (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements/g15b-pilot.txt

      - name: Install isolated phase-one pilot tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/g15b-pilot.txt

      - name: Check structured pilot contract, model, and controlled projections
        run: python -B check_g15b_phase1_pilot.py
        working-directory: tools/systems_engineering

      - name: Check formal joint baseline and deterministic projections
        run: |
          python -B check_g15b_joint_baseline.py
          python -B build_g15b_joint_views.py --check
        working-directory: tools/systems_engineering

      - name: Render the native StrictDoc trial to temporary HTML
        run: strictdoc export --config g15b_pilot/strictdoc/strictdoc_config.py --formats=html --output-dir "$RUNNER_TEMP/g15b-pilot-html" --no-parallelization g15b_pilot/strictdoc
        working-directory: tools/systems_engineering

      - name: Render the formal candidate reading view to temporary HTML
        run: strictdoc export --config systems_engineering/requirements/strictdoc_config.py --formats=html --output-dir "$RUNNER_TEMP/g15b-joint-html" --no-parallelization systems_engineering/requirements/generated

      - name: Run phase-one positive and negative fixtures
        run: python -B -m pytest -q g15b_pilot/tests -p no:cacheprovider
        working-directory: tools/systems_engineering
