        run: |
          set -euo pipefail
          raw="$G3A_EVIDENCE_ROOT/runs/debug/$G3A_DEBUG_RUN_ID/raw/g3a-evidence.json"
          IFS= read -r basis_sha < "$G3A_EVIDENCE_ROOT/authority/debug-basis-sha256.txt"
          bind_command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 120s
            "$G3A_VENV/bin/python" -I -B -X "pycache_prefix=$PYTHONPYCACHEPREFIX" "$G3A_AUTHORITY_HELPER" bind-transport
            --basis "$G3A_EVIDENCE_ROOT/preflight/debug/authority-basis.json"
