      - name: Configure Debug from the explicit disconnected Catch2 source
        id: debug_configure
        shell: bash
        run: |
          set -euo pipefail
          packaging_root="$G3A_EVIDENCE_ROOT/bootstrap/ci-step-packaging/debug_configure"
          derived_script="$packaging_root/readonly.sh"
          derivation_manifest="$packaging_root/derivation.json"
          "$G3A_VENV/bin/python" -I -B - \
            "$packaging_root" \
            "$GITHUB_WORKSPACE/.github/workflows/g3a.yml" \
            "$derived_script" \
            "$derivation_manifest" \
            "debug_configure" \
            "34739" \
            "dd9bcce9bc15f3ef1ff6b063cba0dae4e50d470e2705d390e7232769f8f7d848" \
            "part-01.bin" "12000" "aaee4ff16d1c3cdc7dff50317a45cf5704c32e26324c40687272ab3f6f83a7f2" \
            "part-02.bin" "12000" "5436d30637ce4026187b8e63286dc47d9326162606a8cad90013aa4555889031" \
            "part-03.bin" "10739" "23c25c7b066ee16d940a189ea8fba1bc1d04c7b3ae5f59bd89870e852d48e511" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          
          root = Path(sys.argv[1])
          workflow_path = Path(sys.argv[2])
          script_path = Path(sys.argv[3])
          manifest_path = Path(sys.argv[4])
          step_id = sys.argv[5]
          expected_body_bytes = int(sys.argv[6])
          expected_body_sha256 = sys.argv[7].lower()
          part_arguments = sys.argv[8:]
          if root.is_symlink() or not root.is_dir() or len(part_arguments) != 9:
              raise RuntimeError("invalid package reconstruction inputs")
          parts = []
          part_records = []
          for index in range(0, len(part_arguments), 3):
              name = part_arguments[index]
              expected_bytes = int(part_arguments[index + 1])
              expected_sha256 = part_arguments[index + 2].lower()
              path = root / name
              if path.is_symlink() or not path.is_file():
                  raise RuntimeError("package part is absent or non-ordinary")
              payload = path.read_bytes()
              actual_sha256 = hashlib.sha256(payload).hexdigest()
              if len(payload) != expected_bytes or actual_sha256 != expected_sha256:
                  raise RuntimeError("package part identity mismatch")
              parts.append(payload)
              part_records.append({"name": name, "bytes": len(payload), "sha256": actual_sha256})
          body = b"".join(parts)
          body_sha256 = hashlib.sha256(body).hexdigest()
          if len(body) != expected_body_bytes or body_sha256 != expected_body_sha256:
              raise RuntimeError("reconstructed run body identity mismatch")
          
          def create_exclusive(path: Path, payload: bytes, mode: int) -> None:
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, mode)
              with os.fdopen(descriptor, "wb") as stream:
                  if stream.write(payload) != len(payload):
                      raise RuntimeError("short exclusive packaging write")
                  stream.flush()
