      - name: Collect Debug preflight candidate basis
        id: debug_preflight
        shell: bash
        run: |
          set -euo pipefail
          IFS= read -r module_path < "$G3A_EVIDENCE_ROOT/build-facts/debug-module-path.txt"
          command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 300s
            "$G3A_VENV/bin/python" -I -B -X "pycache_prefix=$PYTHONPYCACHEPREFIX" "$G3A_AUTHORITY_HELPER" collect
              --policy "$G3A_POLICY" \
              --expected-policy-sha256 "$G3A_POLICY_SHA256" \
              --source-root "$GITHUB_WORKSPACE" \
              --build-type Debug \
              --phase preflight \
              --environment-facts "$G3A_EVIDENCE_ROOT/environment-facts.json" \
              --out-dir "$G3A_EVIDENCE_ROOT/preflight/debug" \
              --build-facts "$G3A_EVIDENCE_ROOT/build-facts/debug.json" \
              --module "$module_path" \
              --build-dir "$G3A_DEBUG_BUILD" \
              --git-executable /usr/bin/git \
              --github-event "$GITHUB_EVENT_PATH" \
              --github-event-name "$GITHUB_EVENT_NAME" \
              --github-repository "$GITHUB_REPOSITORY" \
              --github-sha "$GITHUB_SHA" \
              --github-run-id "$GITHUB_RUN_ID" \
              --github-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          printf '%q ' "${command[@]}" > "$G3A_EVIDENCE_ROOT/commands/debug-preflight.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/debug-preflight.command.txt"
          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/commands/debug-preflight.result.json" \
            2> "$G3A_EVIDENCE_ROOT/logs/debug-preflight.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/debug-preflight.exit-code.txt"
          exit "$rc"

