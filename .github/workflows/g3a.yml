          manifest = {
              "schema_version": "b0-g3a-ci-step-packaging-derivation/v1",
              "packaging_namespace": "bootstrap/ci-step-packaging",
              "original_step_id": step_id,
              "materializer_step_ids": [f"package_{step_id}_part_{number}" for number in range(1, 4)],
              "executor_step_id": step_id,
              "old_workflow": {
                  "bytes": 349862,
                  "sha256": "0794311053fa902123dbde095b7c11713fd4aaec61b5bc013bde5e4199b28ed3e",
                  "git_blob_sha1": "74bc7910d26f237c4b8dfdaa31d719bf617d2f9e",
              },
              "candidate_workflow": {
                  "path": ".github/workflows/g3a.yml",
                  "bytes": len(workflow),
                  "sha256": hashlib.sha256(workflow).hexdigest(),
              },
              "original_run_body": {"bytes": len(body), "sha256": body_sha256},
              "parts": part_records,
              "derived_script": {
                  "name": script_path.name,
                  "bytes": len(body),
                  "sha256": body_sha256,
                  "mode": "0400",
              },
              "execution": {
                  "python": "-I -B - with stdlib only",
                  "bash": "source derived script in the original GitHub Actions Bash instance",
                  "original_body_bytes_preserved": True,
                  "new_bash_subprocess": False,
              },
          }
          manifest_bytes = (json.dumps(manifest, indent=2, sort_keys=True) + "\n").encode("utf-8")
          create_exclusive(manifest_path, manifest_bytes, 0o400)
          if manifest_path.read_bytes() != manifest_bytes:
              raise RuntimeError("derivation manifest readback mismatch")
          PY
          . "$derived_script"

