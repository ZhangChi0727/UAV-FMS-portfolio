name: B0 G3-A evidence-closure candidate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  G3A_EVENT_HEAD: "${{ github.event.pull_request.head.sha || github.sha }}"
  G3A_EVENT_MERGE: "${{ github.event.pull_request.merge_commit_sha || github.sha }}"
  G3A_POLICY: "${{ github.workspace }}/05_integration/b0/configs/g3a_authority_policy.v1.json"
  G3A_POLICY_SHA256: f5748630aa17724888d2c8b5472b282c42485aacc4021614e0d17764be42541d
  G3A_AUTHORITY_HELPER: "${{ github.workspace }}/05_integration/b0/binding_checks/g3a_authority.py"
  G3A_DEBUG_BUILD: "${{ github.workspace }}/build/b0-controller/debug"
  G3A_RELEASE_BUILD: "${{ github.workspace }}/build/b0-controller/release"
  G3A_CATCH_ROOT: "${{ github.workspace }}/build/b0-controller/debug/_deps/catch2-src"
  G3A_CATCH_COMMIT: b5373dadca40b7edc8570cf9470b9b1cb1934d40
  G3A_DEBUG_RUN_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}-debug"
  G3A_RELEASE_RUN_ID: "ci-${{ github.run_id }}-${{ github.run_attempt }}-release"
  G3A_STARTUP_FIXTURES_ZLIB_BASE64: ""
  G3A_STARTUP_PRODUCTION_ZLIB_BASE64: ""
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PIP_ONLY_BINARY: ":all:"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"

jobs:
  evidence-candidate:
    name: G3-A sealed Debug and Release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload_evidence.outputs.artifact-id }}
      artifact-url: ${{ steps.upload_evidence.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload_evidence.outputs.artifact-digest }}
    steps:
      - name: Establish the partial-evidence root before checkout
        id: bootstrap_runner
        env:
          G3A_EVIDENCE_ROOT: "${{ runner.temp }}/g3a-evidence"
          G3A_VENV: "${{ runner.temp }}/g3a-venv"
          G3A_PYCACHE_ROOT: "${{ runner.temp }}/g3a-evidence/bootstrap/pycache"
        shell: bash
        run: |
          set -euo pipefail
          printf 'G3A_EVIDENCE_ROOT=%s\n' "$G3A_EVIDENCE_ROOT" >> "$GITHUB_ENV"
          printf 'G3A_VENV=%s\n' "$G3A_VENV" >> "$GITHUB_ENV"
          printf 'PYTHONPYCACHEPREFIX=%s\n' "$G3A_PYCACHE_ROOT" >> "$GITHUB_ENV"
          mkdir -p \
            "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts" \
            "$G3A_EVIDENCE_ROOT/source" \
            "$G3A_EVIDENCE_ROOT/commands" \
            "$G3A_EVIDENCE_ROOT/logs" \
            "$G3A_EVIDENCE_ROOT/reports"
          for candidate in "$G3A_EVENT_HEAD" "$G3A_EVENT_MERGE" "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA"; do
            if [[ ! "$candidate" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf 'invalid 40-hex Git identity: %q\n' "$candidate" >&2
              exit 64
            fi
          done
          printf '%s\n' "$G3A_EVENT_HEAD" > "$G3A_EVIDENCE_ROOT/source/candidate-head.txt"
          printf '%s\n' "$G3A_EVENT_MERGE" > "$G3A_EVIDENCE_ROOT/source/event-merge.txt"
          printf '%s\n' "$GITHUB_SHA" > "$G3A_EVIDENCE_ROOT/source/github-sha.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > "$G3A_EVIDENCE_ROOT/source/github-workflow-sha.txt"
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > "$G3A_EVIDENCE_ROOT/source/github-workflow-ref.txt"
          printf '%s\n' "$GITHUB_REF" > "$G3A_EVIDENCE_ROOT/source/github-ref.txt"
          printf '%s\n' "${GITHUB_HEAD_REF:-}" > "$G3A_EVIDENCE_ROOT/source/github-head-ref.txt"
          printf '%s\n' "${GITHUB_BASE_REF:-}" > "$G3A_EVIDENCE_ROOT/source/github-base-ref.txt"
          cp "$GITHUB_EVENT_PATH" "$G3A_EVIDENCE_ROOT/source/github-event.json"
          printf '%s\n' "${RUNNER_OS:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/RUNNER_OS.txt"
          printf '%s\n' "${RUNNER_ARCH:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/RUNNER_ARCH.txt"
          printf '%s\n' "${RUNNER_ENVIRONMENT:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/RUNNER_ENVIRONMENT.txt"
          printf '%s\n' "${RUNNER_NAME:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/RUNNER_NAME.txt"
          printf '%s\n' "${RUNNER_TOOL_CACHE:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/RUNNER_TOOL_CACHE.txt"
          printf '%s\n' "${ImageOS:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/ImageOS.txt"
          printf '%s\n' "${ImageVersion:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/ImageVersion.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/GITHUB_RUN_ID.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/GITHUB_RUN_ATTEMPT.txt"
          printf '%s\n' "$GITHUB_JOB" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/GITHUB_JOB.txt"
          printf '%s\n' "${GITHUB_ACTION:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/GITHUB_ACTION.txt"
          printf '%s\n' "${GITHUB_ACTION_REPOSITORY:-}" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/GITHUB_ACTION_REPOSITORY.txt"
          printf '%s\n' "$GITHUB_WORKSPACE" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/GITHUB_WORKSPACE.txt"
          printf '%s\n' "$RUNNER_TEMP" > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/RUNNER_TEMP.txt"
          /usr/bin/uname -a > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/uname.txt"
          cp /etc/os-release "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/os-release.txt"
          /usr/bin/git --version > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/git-version.txt"
          python_cache_candidate="${RUNNER_TOOL_CACHE:-}/Python/3.11.17"
          if [ -n "${RUNNER_TOOL_CACHE:-}" ] && [ -e "$python_cache_candidate" ]; then
            printf 'preexisting\n' > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/python-3.11.17-cache-state.txt"
          else
            printf 'absent-before-setup-python\n' > "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/python-3.11.17-cache-state.txt"
          fi
          (
            cd "$G3A_EVIDENCE_ROOT"
            /usr/bin/find bootstrap/runner-facts -type f -print0 \
              | /usr/bin/sort -z \
              | /usr/bin/xargs -0 /usr/bin/sha256sum
          ) > "$G3A_EVIDENCE_ROOT/bootstrap/runner-platform-manifest.tsv"
          /usr/bin/sha256sum "$G3A_EVIDENCE_ROOT/bootstrap/runner-platform-manifest.tsv" \
            | /usr/bin/awk '{print $1}' \
            > "$G3A_EVIDENCE_ROOT/bootstrap/runner-platform-manifest.sha256"

      - name: Check out the exact event head
        id: checkout_source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.G3A_EVENT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Retain event and source inputs
        id: retain_source_inputs
        env:
          G3A_EVIDENCE_ROOT: "${{ runner.temp }}/g3a-evidence"
          G3A_VENV: "${{ runner.temp }}/g3a-venv"
          G3A_PYCACHE_ROOT: "${{ runner.temp }}/g3a-evidence/bootstrap/pycache"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$G3A_EVIDENCE_ROOT/bootstrap" \
            "$G3A_EVIDENCE_ROOT/source" \
            "$G3A_EVIDENCE_ROOT/commands" \
            "$G3A_EVIDENCE_ROOT/logs" \
            "$G3A_EVIDENCE_ROOT/prebuild" \
            "$G3A_EVIDENCE_ROOT/preflight" \
            "$G3A_EVIDENCE_ROOT/build-facts" \
            "$G3A_EVIDENCE_ROOT/runs/debug" \
            "$G3A_EVIDENCE_ROOT/runs/release" \
            "$G3A_EVIDENCE_ROOT/authority" \
            "$G3A_EVIDENCE_ROOT/reports" \
            "$G3A_EVIDENCE_ROOT/diagnostics" \
            "$G3A_EVIDENCE_ROOT/compare" \
            "$G3A_EVIDENCE_ROOT/pytest" \
            "$G3A_DEBUG_BUILD" \
            "$G3A_RELEASE_BUILD"
          actual_head="$(/usr/bin/git --no-optional-locks -c core.fsmonitor=false rev-parse --verify HEAD)"
          actual_tree="$(/usr/bin/git --no-optional-locks -c core.fsmonitor=false rev-parse --verify 'HEAD^{tree}')"
          printf '%s\n' "$actual_head" > "$G3A_EVIDENCE_ROOT/source/checkout-head.txt"
          printf '%s\n' "$actual_tree" > "$G3A_EVIDENCE_ROOT/source/checkout-tree.txt"
          printf '%s\n' "$G3A_EVENT_HEAD" > "$G3A_EVIDENCE_ROOT/source/event-head.txt"
          test "$actual_head" = "$G3A_EVENT_HEAD"
          workflow_path='.github/workflows/g3a.yml'
          fetch_command=(/usr/bin/git --no-optional-locks -c core.fsmonitor=false fetch --no-tags --depth=1 origin "$GITHUB_WORKFLOW_SHA")
          printf '%q ' "${fetch_command[@]}" > "$G3A_EVIDENCE_ROOT/commands/workflow-fetch.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/workflow-fetch.command.txt"
          set +e
          GIT_TERMINAL_PROMPT=0 "${fetch_command[@]}" \
            > "$G3A_EVIDENCE_ROOT/logs/workflow-fetch.log" 2>&1
          fetch_rc=$?
          set -e
          printf '%s\n' "$fetch_rc" > "$G3A_EVIDENCE_ROOT/commands/workflow-fetch.exit-code.txt"
          if [ "$fetch_rc" -ne 0 ]; then exit "$fetch_rc"; fi
          /usr/bin/git --no-optional-locks -c core.fsmonitor=false \
            show "${GITHUB_WORKFLOW_SHA}:${workflow_path}" \
            > "$G3A_EVIDENCE_ROOT/source/actual-executing-workflow.yml"
          cp "$GITHUB_WORKSPACE/$workflow_path" "$G3A_EVIDENCE_ROOT/source/candidate-workflow.yml"
          workflow_sha="$(/usr/bin/sha256sum "$G3A_EVIDENCE_ROOT/source/actual-executing-workflow.yml" | /usr/bin/awk '{print $1}')"
          candidate_sha="$(/usr/bin/sha256sum "$G3A_EVIDENCE_ROOT/source/candidate-workflow.yml" | /usr/bin/awk '{print $1}')"
          printf '%s\n' "$workflow_sha" > "$G3A_EVIDENCE_ROOT/source/actual-executing-workflow.sha256"
          printf '%s\n' "$candidate_sha" > "$G3A_EVIDENCE_ROOT/source/candidate-workflow.sha256"
          test "$workflow_sha" = "$candidate_sha"
          printf '%s\t%s\n' \
            candidate_head "$G3A_EVENT_HEAD" \
            event_merge "$G3A_EVENT_MERGE" \
            github_sha "$GITHUB_SHA" \
            workflow_sha "$GITHUB_WORKFLOW_SHA" \
            workflow_ref "$GITHUB_WORKFLOW_REF" \
            checkout_tree "$actual_tree" \
            workflow_bytes_sha256 "$workflow_sha" \
            candidate_workflow_bytes_sha256 "$candidate_sha" \
            > "$G3A_EVIDENCE_ROOT/source/workflow-source-bridge.tsv"
          cp "$G3A_POLICY" "$G3A_EVIDENCE_ROOT/source/g3a-authority-policy.v1.json"
          cp "$GITHUB_WORKSPACE/requirements/b0-dev.txt" "$G3A_EVIDENCE_ROOT/source/b0-dev.txt"
          cp "$GITHUB_WORKSPACE/docs/work_orders/B0_G3_A_evidence_closure_work_order.md" \
            "$G3A_EVIDENCE_ROOT/source/B0_G3_A_evidence_closure_work_order.md"
          printf '%s\n' \
            'requirements/b0-dev.txt pins direct top-level versions only.' \
            'It is not a complete transitive dependency or wheel-hash lock.' \
            'The no-cache, wheel-only bootstrap report is retained as observed evidence.' \
            'The pinned setup-python CPython, its stdlib, venv/ensurepip bootstrap, and outer GitHub Actions bash are trusted bootstrap/platform assumptions.' \
            'Wheel-installed startup code is not covered by that assumption and must pass the no-site admission step before normal Python startup.' \
            > "$G3A_EVIDENCE_ROOT/bootstrap/limitations.txt"

      - name: Select exact CPython
        id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.17
          check-latest: false

      - name: Retain the selected CPython provenance
        id: retain_python_provenance
        shell: bash
        run: |
          set -euo pipefail
          python_executable="$(command -v python)"
          test -n "$python_executable"
          python_executable="$(readlink -f "$python_executable")"
          printf '%s\n' "$python_executable" > "$G3A_EVIDENCE_ROOT/bootstrap/setup-python-executable.txt"
          /usr/bin/sha256sum "$python_executable" > "$G3A_EVIDENCE_ROOT/bootstrap/setup-python-executable.sha256"
          command=(python -I -B -)
          printf '%q ' "${command[@]}" > "$G3A_EVIDENCE_ROOT/commands/setup-python-provenance.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/setup-python-provenance.command.txt"
          set +e
          "${command[@]}" \
            "$G3A_EVIDENCE_ROOT/bootstrap/setup-python-provenance.json" \
            "$G3A_EVIDENCE_ROOT/bootstrap/runner-facts/python-3.11.17-cache-state.txt" \
            > "$G3A_EVIDENCE_ROOT/logs/setup-python-provenance.log" 2>&1 <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          import sysconfig

          output = Path(sys.argv[1])
          before_state = Path(sys.argv[2]).read_text(encoding="ascii").strip()
          executable = Path(sys.executable).resolve(strict=True)
          document = {
              "schema_version": "b0-g3a-setup-python-provenance/v1",
              "before_setup_cache_state": before_state,
              "observed_setup_mode": (
                  "preexisting_runner_tool_cache"
                  if before_state == "preexisting"
                  else "created_or_downloaded_by_setup_python"
              ),
              "executable": str(executable),
              "executable_bytes": executable.stat().st_size,
              "executable_sha256": hashlib.sha256(executable.read_bytes()).hexdigest(),
              "implementation": sys.implementation.name,
              "version": sys.version,
              "version_info": list(sys.version_info),
              "soabi": sysconfig.get_config_var("SOABI") or sys.implementation.cache_tag,
              "prefix": sys.prefix,
              "base_prefix": sys.base_prefix,
              "limitation": (
                  "The retained setup-python action log is authoritative for exact "
                  "cache/download network behavior; this record observes pre/post cache state "
                  "and the selected executable bytes."
              ),
          }
          output.write_text(json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/setup-python-provenance.exit-code.txt"
          exit "$rc"

      - name: Create the single candidate virtual environment
        id: create_venv
        shell: bash
        run: |
          set -euo pipefail
          command=(/usr/bin/timeout --signal=TERM --kill-after=10s 120s python -m venv "$G3A_VENV")
          printf '%q ' "${command[@]}" > "$G3A_EVIDENCE_ROOT/commands/create-venv.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/create-venv.command.txt"
          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/logs/create-venv.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/create-venv.exit-code.txt"
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' "$G3A_VENV/bin" >> "$GITHUB_PATH"
            printf 'VIRTUAL_ENV=%s\n' "$G3A_VENV" >> "$GITHUB_ENV"
          fi
          exit "$rc"

      - name: Capture the pre-third-party Python bootstrap baseline
        id: capture_python_bootstrap_baseline
        shell: bash
        run: |
          set -euo pipefail
          program="$G3A_EVIDENCE_ROOT/bootstrap/python-startup-production.py"
          baseline_root="$G3A_EVIDENCE_ROOT/bootstrap/python-startup-baseline"
          materializer='import base64,hashlib,os,sys,zlib; expected="51563d826f56b6379773964455c600d0fdb61ea78eb7856cdfb3cad5ab70bb30"; source=zlib.decompress(base64.b64decode(os.environ["G3A_STARTUP_PRODUCTION_ZLIB_BASE64"],validate=True)); assert len(source)==39444 and hashlib.sha256(source).hexdigest()==expected; os.environ["G3A_EXECUTING_PRODUCTION_SHA256"]=expected; path=sys.argv[1]; fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_CLOEXEC,0o400); output=os.fdopen(fd,"wb"); assert output.write(source)==len(source); output.flush(); os.fsync(output.fileno()); output.close(); sys.argv=[path]+sys.argv[2:]; exec(compile(source,path,"exec"),{"__name__":"__main__","__file__":path})'
          command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 30s
            "$G3A_VENV/bin/python" -I -B -S -c "$materializer"
            "$program" --baseline "$G3A_VENV" "$G3A_EVIDENCE_ROOT"
            "$G3A_EVIDENCE_ROOT/bootstrap/setup-python-executable.txt" "$baseline_root"
          )
          printf '%q ' "${command[@]}" > "$G3A_EVIDENCE_ROOT/commands/python-bootstrap-baseline.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/python-bootstrap-baseline.command.txt"
          printf '%s\n' 'PYTHON=-I -B -S' 'MODE=baseline-before-third-party-install' \
            > "$G3A_EVIDENCE_ROOT/commands/python-bootstrap-baseline.environment.txt"
          set +e
          "${command[@]}" > "$G3A_EVIDENCE_ROOT/logs/python-bootstrap-baseline.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/python-bootstrap-baseline.exit-code.txt"
          exit "$rc"

      - name: Install exact direct pins without cache or source distributions
        id: install_dependencies
        shell: bash
        run: |
          set -euo pipefail
          command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 300s
            "$G3A_VENV/bin/python" -I -B -m pip --isolated install
            --disable-pip-version-check --no-input --no-cache-dir
            --only-binary=:all: --index-url https://pypi.org/simple
            --report "$G3A_EVIDENCE_ROOT/bootstrap/pip-report.json"
            -r "$GITHUB_WORKSPACE/requirements/b0-dev.txt"
          )
          printf '%q ' "${command[@]}" > "$G3A_EVIDENCE_ROOT/commands/bootstrap.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/bootstrap.command.txt"
          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/logs/bootstrap.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/bootstrap.exit-code.txt"
          exit "$rc"

      - name: Admit installed Python startup bytes before normal site startup
        id: admit_python_startup
        shell: bash
        run: |
          set -euo pipefail
          runner='import base64,hashlib,os,sys,zlib; expected="51563d826f56b6379773964455c600d0fdb61ea78eb7856cdfb3cad5ab70bb30"; source=zlib.decompress(base64.b64decode(os.environ["G3A_STARTUP_PRODUCTION_ZLIB_BASE64"],validate=True)); assert len(source)==39444 and hashlib.sha256(source).hexdigest()==expected; os.environ["G3A_EXECUTING_PRODUCTION_SHA256"]=expected; path=sys.argv[1]; sys.argv=[path]+sys.argv[2:]; exec(compile(source,path,"exec"),{"__name__":"__main__","__file__":path})'
          command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 30s
            "$G3A_VENV/bin/python" -I -B -S -c "$runner"
            "$G3A_EVIDENCE_ROOT/bootstrap/python-startup-production.py"
            --admit "$G3A_VENV" "$G3A_EVIDENCE_ROOT"
            "$G3A_EVIDENCE_ROOT/bootstrap/setup-python-executable.txt"
            "$G3A_EVIDENCE_ROOT/bootstrap/python-startup-admission"
            "$G3A_EVIDENCE_ROOT/bootstrap/python-startup-baseline/observation-manifest.json"
            "$G3A_EVIDENCE_ROOT/bootstrap/pip-report.json"
            "$G3A_EVIDENCE_ROOT/bootstrap/startup-admission.json"
            "$G3A_EVIDENCE_ROOT/bootstrap/python-startup-admission/fixture-seal.json"
            "$PYTHONPYCACHEPREFIX"
          )
          printf '%q ' "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/commands/startup-admission.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/startup-admission.command.txt"
          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/logs/startup-admission.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/startup-admission.exit-code.txt"
          exit "$rc"

      - name: Check out the pinned Catch2 source once
        id: checkout_catch2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: catchorg/Catch2
          ref: b5373dadca40b7edc8570cf9470b9b1cb1934d40
          path: build/b0-controller/debug/_deps/catch2-src
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the retained Catch2 head and clean checkout
        id: verify_catch2
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(/usr/bin/git --no-optional-locks -c core.fsmonitor=false \
            -C "$G3A_CATCH_ROOT" rev-parse --verify HEAD)"
          printf '%s\n' "$actual_head" > "$G3A_EVIDENCE_ROOT/source/catch2-head.txt"
          printf '%s\n' "$G3A_CATCH_COMMIT" > "$G3A_EVIDENCE_ROOT/source/catch2-expected-head.txt"
          test "$actual_head" = "$G3A_CATCH_COMMIT"
          clean_command=(
            /usr/bin/git --no-optional-locks -c core.fsmonitor=false
            -C "$G3A_CATCH_ROOT" status --porcelain=v1 --untracked-files=all
          )
          printf '%q ' "${clean_command[@]}" \
            > "$G3A_EVIDENCE_ROOT/commands/catch2-clean.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/catch2-clean.command.txt"
          set +e
          "${clean_command[@]}" \
            > "$G3A_EVIDENCE_ROOT/source/catch2-clean.stdout.txt" \
            2> "$G3A_EVIDENCE_ROOT/source/catch2-clean.stderr.txt"
          clean_rc=$?
          set -e
          printf '%s\n' "$clean_rc" \
            > "$G3A_EVIDENCE_ROOT/commands/catch2-clean.exit-code.txt"
          [ "$clean_rc" -eq 0 ]
          [ ! -s "$G3A_EVIDENCE_ROOT/source/catch2-clean.stdout.txt" ]
          [ ! -s "$G3A_EVIDENCE_ROOT/source/catch2-clean.stderr.txt" ]

      - name: Assemble current CI environment facts without importing the DUT
        id: collect_environment_facts
        shell: bash
        run: |
          set -euo pipefail
          command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 180s
            "$G3A_VENV/bin/python" -I -B -X "pycache_prefix=$PYTHONPYCACHEPREFIX" -
            "$G3A_POLICY"
            "$G3A_CATCH_ROOT"
            "$G3A_EVIDENCE_ROOT/bootstrap/startup-admission.json"
            "$G3A_EVIDENCE_ROOT/bootstrap/process-executable-allowlist.tsv"
            "$G3A_EVIDENCE_ROOT/bootstrap/process-executable-allowlist.sha256"
            "$G3A_EVIDENCE_ROOT/environment-facts.json"
          )
          printf '%q ' "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/commands/environment-facts.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/environment-facts.command.txt"
          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/logs/environment-facts.log" 2>&1 <<'PY'
          from __future__ import annotations

          import base64
          from collections import Counter
          import csv
          import hashlib
          from importlib import metadata
          import io
          import json
          from pathlib import Path
          import re
          import shutil
          import sys
          import sysconfig

          (policy_path, catch_argument, startup_argument, allowlist_argument,
           allowlist_digest_argument, output_argument) = map(Path, sys.argv[1:])
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          section = policy["environment"]
          purelib = Path(sysconfig.get_path("purelib")).resolve(strict=True)
          catch_root = catch_argument.resolve(strict=True)
          startup = json.loads(startup_argument.read_text(encoding="utf-8"))
          startup_decision = json.loads(
              (startup_argument.parent / "python-startup-admission/decision.json").read_text(
                  encoding="utf-8"
              )
          )
          records: list[dict[str, object]] = []
          seen: set[Path] = set()

          def add(role: str, candidate: Path) -> dict[str, object]:
              resolved = candidate.resolve(strict=True)
              if not resolved.is_file():
                  raise RuntimeError(f"not a regular fact file: {resolved}")
              if resolved in seen:
                  raise RuntimeError(f"duplicate resolved fact file: {resolved}")
              raw = resolved.read_bytes()
              seen.add(resolved)
              record = {
                  "role": role,
                  "path": str(resolved),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }
              records.append(record)
              return record

          def add_tree(role: str, root: Path, *, skip_git: bool = False) -> None:
              resolved_root = root.resolve(strict=True)
              for candidate in sorted(root.rglob("*"), key=lambda item: item.as_posix()):
                  if skip_git and ".git" in candidate.relative_to(root).parts:
                      continue
                  if not candidate.is_file():
                      continue
                  resolved = candidate.resolve(strict=True)
                  if not resolved.is_relative_to(resolved_root):
                      continue
                  add(role, resolved)

          python_invocation = Path(sys.executable)
          add("python_binary", python_invocation)
          add("python_configuration", Path(sys.prefix) / "pyvenv.cfg")
          if startup.get("status") != "observations_complete_pending_immutable_decision":
              raise RuntimeError("Python startup observations were not completed")
          if startup_decision.get("status") != "accepted" or startup_decision.get("mode") != "--admit":
              raise RuntimeError("Python startup did not pass prior no-site admission")
          if Path(startup["venv_prefix"]).resolve(strict=True) != Path(sys.prefix).resolve(strict=True):
              raise RuntimeError("normal Python prefix differs from admitted venv")
          if Path(startup["base_prefix"]).resolve(strict=True) != Path(sys.base_prefix).resolve(strict=True):
              raise RuntimeError("normal Python base prefix differs from admitted CPython")
          if sys.pycache_prefix is None:
              raise RuntimeError("normal Python omitted the admitted bytecode isolation")
          if Path(startup["pycache_prefix_for_normal_processes"]).resolve(strict=False) != Path(
              sys.pycache_prefix
          ).resolve(strict=False):
              raise RuntimeError("normal Python did not preserve the admitted bytecode isolation")
          for admitted in startup["admitted_files"]:
              candidate = Path(str(admitted["path"]))
              raw = candidate.read_bytes()
              if len(raw) != admitted["bytes"] or hashlib.sha256(raw).hexdigest() != admitted["sha256"]:
                  raise RuntimeError(f"admitted startup bytes changed: {candidate}")
              add("python_startup", candidate)

          package_versions = section["package_versions"]
          observed_versions: dict[str, str] = {}
          for package_name, expected_version in package_versions.items():
              distribution = metadata.distribution(package_name)
              observed_versions[package_name] = distribution.version
              if distribution.version != expected_version:
                  raise RuntimeError(
                      f"package version mismatch for {package_name}: "
                      f"{distribution.version} != {expected_version}"
                  )
              metadata_paths = [
                  Path(distribution.locate_file(item)).resolve(strict=True)
                  for item in (distribution.files or ())
                  if item.name == "METADATA"
                  and any(part.endswith(".dist-info") for part in item.parts)
              ]
              if len(metadata_paths) != 1:
                  raise RuntimeError(f"ambiguous METADATA for {package_name}")
              add(f"package_metadata:{package_name}", metadata_paths[0])
              add(
                  f"package_metadata:{package_name}",
                  metadata_paths[0].parent / "RECORD",
              )

          for root in (purelib / "numpy", purelib / "numpy.libs"):
              if root.is_dir():
                  add_tree("numpy_runtime", root)

          cmake_root = purelib / "cmake"
          cmake_invocation = Path(shutil.which("cmake") or "")
          cmake_binary = cmake_root / "data/bin/cmake"
          add("tool:cmake", cmake_invocation)
          add("tool:cmake", cmake_binary)
          for pattern in ("*.py", "__pycache__/*.pyc"):
              for candidate in sorted(cmake_root.glob(pattern)):
                  add("cmake_python_runtime", candidate)

          pybind_root = purelib / "pybind11"
          for pattern in ("*.py", "__pycache__/*.pyc"):
              for candidate in sorted(pybind_root.glob(pattern)):
                  add("pybind_python_runtime", candidate)
          ninja_invocation = Path(shutil.which("ninja") or "")
          add("tool:ninja", ninja_invocation)

          compiler_invocation = Path("/usr/bin/c++")
          compiler = compiler_invocation.resolve(strict=True)
          add("tool:compiler", compiler)
          match = re.search(r"-(\d+)$", compiler.name)
          gcc_parent = Path("/usr/lib/gcc/x86_64-linux-gnu")
          if match is None:
              versions = sorted(
                  (item for item in gcc_parent.iterdir() if item.name.isdigit()),
                  key=lambda item: int(item.name),
              )
              if not versions:
                  raise RuntimeError("no GCC subtool directory")
              gcc_root = versions[-1]
          else:
              gcc_root = gcc_parent / match.group(1)
          compiler_subtools: list[Path] = []
          for name in ("cc1plus", "collect2", "liblto_plugin.so", "lto-wrapper", "lto1"):
              candidate = gcc_root / name
              if candidate.is_file():
                  add("tool:compiler_subtools", candidate)
                  if name != "liblto_plugin.so":
                      compiler_subtools.append(candidate)

          binutils: list[Path] = []
          for name in ("ar", "as", "ld", "nm", "objcopy", "ranlib", "strip"):
              candidate = Path("/usr/bin") / name
              add("tool:binutils", candidate)
              binutils.append(candidate)
          shell_invocation = Path("/bin/sh")
          timeout_invocation = Path("/usr/bin/timeout")
          trace_invocation = Path("/usr/bin/strace")
          platform_invocation = Path("/usr/bin/uname")
          add("tool:shell", shell_invocation)
          add("tool:timeout", timeout_invocation)
          add("tool:trace", trace_invocation)
          add("tool:platform", platform_invocation)

          add_tree("python_headers", Path(sysconfig.get_path("include")))
          add_tree("pybind_headers", pybind_root / "include/pybind11")
          add_tree("pybind_cmake", pybind_root / "share/cmake/pybind11")
          add_tree("cmake_modules", cmake_root / "data/share")
          add_tree("catch_source", catch_root, skip_git=True)

          counts = Counter(str(record["role"]) for record in records)
          required = set(section["required_file_roles"])
          if set(counts) != required:
              raise RuntimeError(
                  f"environment role set mismatch: {sorted(set(counts) ^ required)}"
              )
          for role, rule in section["file_role_rules"].items():
              if not rule["min_files"] <= counts[role] <= rule["max_files"]:
                  raise RuntimeError(
                      f"environment role count outside policy: {role}={counts[role]}"
                  )

          record_by_path = {str(record["path"]): record for record in records}
          executable_entries_by_path: dict[str, dict[str, object]] = {}

          def bind_executable(
              family: str,
              candidate: Path,
              provenance: str,
              *,
              require_environment_record: bool = True,
          ) -> None:
              invocation = candidate.absolute()
              resolved = candidate.resolve(strict=True)
              raw = resolved.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if require_environment_record:
                  record = record_by_path.get(str(resolved))
                  if record is None or record["sha256"] != digest:
                      raise RuntimeError(
                          f"executable is not bound to an environment fact: {candidate}"
                      )
              for exact_path in dict.fromkeys((str(invocation), str(resolved))):
                  entry = {
                      "family": family,
                      "path": exact_path,
                      "resolved_path": str(resolved),
                      "bytes": len(raw),
                      "sha256": digest,
                      "provenance": provenance,
                  }
                  previous = executable_entries_by_path.setdefault(exact_path, entry)
                  if previous != entry:
                      raise RuntimeError(f"ambiguous executable-family binding: {exact_path}")

          bind_executable("cmake", cmake_invocation, "environment role tool:cmake")
          bind_executable("cmake", cmake_binary, "environment role tool:cmake")
          bind_executable("python", python_invocation, "environment role python_binary")
          bind_executable("compiler", compiler_invocation, "environment role tool:compiler")
          for candidate in compiler_subtools:
              bind_executable(
                  "compiler_subtools", candidate, "environment role tool:compiler_subtools"
              )
          for candidate in binutils:
              bind_executable("binutils", candidate, "environment role tool:binutils")
          bind_executable("shell", shell_invocation, "environment role tool:shell")
          bind_executable("platform", platform_invocation, "environment role tool:platform")
          bind_executable("supervisor", timeout_invocation, "environment role tool:timeout")
          bind_executable("trace", trace_invocation, "environment role tool:trace")

          ninja_distribution = metadata.distribution("ninja")
          ninja_internal_items = [
              item
              for item in (ninja_distribution.files or ())
              if item.name == "ninja" and tuple(item.parts[-3:-1]) == ("data", "bin")
          ]
          if len(ninja_internal_items) > 1:
              raise RuntimeError("ambiguous ninja wheel executable")
          if ninja_internal_items:
              ninja_item = ninja_internal_items[0]
              ninja_internal = Path(ninja_distribution.locate_file(ninja_item)).resolve(strict=True)
              ninja_record_paths = [
                  Path(ninja_distribution.locate_file(item)).resolve(strict=True)
                  for item in (ninja_distribution.files or ())
                  if item.name == "RECORD"
                  and any(part.endswith(".dist-info") for part in item.parts)
              ]
              if len(ninja_record_paths) != 1:
                  raise RuntimeError("ninja wheel RECORD is missing or ambiguous")
              ninja_rows = {
                  row[0]: row
                  for row in csv.reader(io.StringIO(
                      ninja_record_paths[0].read_text(encoding="utf-8")
                  ))
                  if row
              }
              ninja_row = ninja_rows.get(ninja_item.as_posix())
              ninja_raw = ninja_internal.read_bytes()
              ninja_digest = base64.urlsafe_b64encode(
                  hashlib.sha256(ninja_raw).digest()
              ).rstrip(b"=").decode()
              if (
                  ninja_row is None
                  or len(ninja_row) != 3
                  or ninja_row[1] != f"sha256={ninja_digest}"
                  or ninja_row[2] != str(len(ninja_raw))
              ):
                  raise RuntimeError("ninja wheel executable does not match RECORD")
              ninja_provenance = (
                  "environment role tool:ninja plus ninja wheel RECORD verification"
              )
              bind_executable("ninja", ninja_invocation, ninja_provenance)
              bind_executable(
                  "ninja",
                  ninja_internal,
                  ninja_provenance,
                  require_environment_record=False,
              )
          else:
              bind_executable("ninja", ninja_invocation, "environment role tool:ninja")

          executable_entries = [
              executable_entries_by_path[path]
              for path in sorted(executable_entries_by_path)
          ]
          allowlist_lines = ["schema=b0-g3a-process-executable-allowlist/v1"] + [
              "\t".join((
                  str(entry["family"]),
                  str(entry["path"]),
                  str(entry["sha256"]),
              ))
              for entry in executable_entries
          ]
          allowlist_raw = ("\n".join(allowlist_lines) + "\n").encode("utf-8")
          allowlist_digest = hashlib.sha256(allowlist_raw).hexdigest()
          allowlist_argument.write_bytes(allowlist_raw)
          allowlist_digest_argument.write_text(allowlist_digest + "\n", encoding="ascii")

          document = {
              "schema_version": "b0-g3a-environment-facts/v1",
              "status": "ci_candidate_facts_not_human_f0_accept",
              "python": {
                  "major": sys.version_info.major,
                  "minor": sys.version_info.minor,
                  "soabi": sysconfig.get_config_var("SOABI")
                  or sys.implementation.cache_tag,
                  "prefix": sys.prefix,
                  "base_prefix": sys.base_prefix,
                  "executable": sys.executable,
              },
              "package_versions": observed_versions,
              "file_counts_by_role": dict(sorted(counts.items())),
              "process_executable_allowlist": {
                  "schema_version": "b0-g3a-process-executable-allowlist/v1",
                  "path": str(allowlist_argument.resolve(strict=True)),
                  "sha256": allowlist_digest,
                  "entry_count": len(executable_entries),
                  "entries": executable_entries,
              },
              "limitations": [
                  "direct requirements are version-pinned but transitive wheels are not hash-locked",
                  "finite policy-selected files, not complete supply-chain attestation",
                  "tool:shell is the resolved /bin/sh used by Ninja inner rules",
                  "the outer GitHub Actions bash is a trusted runner/platform fact, not the inner tool:shell role",
              ],
              "python_startup_admission": startup,
              "files": records,
          }
          output_argument.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"status": "candidate_facts_written", "counts": counts}))
          PY
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/environment-facts.exit-code.txt"
          exit "$rc"

      - name: Collect Debug prebuild source and environment closure
        id: debug_prebuild
        shell: bash
        run: |
          set -euo pipefail
          command=(
            /usr/bin/timeout --signal=TERM --kill-after=10s 300s
            "$G3A_VENV/bin/python" -I -B -X "pycache_prefix=$PYTHONPYCACHEPREFIX" "$G3A_AUTHORITY_HELPER" collect
              --policy "$G3A_POLICY" \
              --expected-policy-sha256 "$G3A_POLICY_SHA256" \
              --source-root "$GITHUB_WORKSPACE" \
              --build-type Debug \
              --phase prebuild \
              --environment-facts "$G3A_EVIDENCE_ROOT/environment-facts.json" \
              --out-dir "$G3A_EVIDENCE_ROOT/prebuild/debug" \
              --build-dir "$G3A_DEBUG_BUILD" \
              --git-executable /usr/bin/git \
              --github-event "$GITHUB_EVENT_PATH" \
              --github-event-name "$GITHUB_EVENT_NAME" \
              --github-repository "$GITHUB_REPOSITORY" \
              --github-sha "$GITHUB_SHA" \
              --github-run-id "$GITHUB_RUN_ID" \
              --github-run-attempt "$GITHUB_RUN_ATTEMPT"
          )
          printf '%q ' "${command[@]}" > "$G3A_EVIDENCE_ROOT/commands/debug-prebuild.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/debug-prebuild.command.txt"
          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/commands/debug-prebuild.result.json" \
            2> "$G3A_EVIDENCE_ROOT/logs/debug-prebuild.log"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/debug-prebuild.exit-code.txt"
          exit "$rc"

      - name: Materialize debug_configure run body part 1 of 3
        id: package_debug_configure_part_1
        shell: bash
        run: |
          set -euo pipefail
          packaging_root="$G3A_EVIDENCE_ROOT/bootstrap/ci-step-packaging/debug_configure"
          "$G3A_VENV/bin/python" -I -B - \
            "$packaging_root" \
            "part-01.bin" \
            "12000" \
            "aaee4ff16d1c3cdc7dff50317a45cf5704c32e26324c40687272ab3f6f83a7f2" <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import os
          from pathlib import Path
          import sys
          
          root = Path(sys.argv[1])
          name = sys.argv[2]
          expected_bytes = int(sys.argv[3])
          expected_sha256 = sys.argv[4].lower()
          try:
              root.mkdir(parents=True, exist_ok=False)
          except FileExistsError:
              if root.is_symlink() or not root.is_dir():
                  raise RuntimeError("packaging root is not an ordinary directory")
          target = root / name
          payload_b64 = b""
          payload = base64.b64decode(payload_b64, validate=True)
          if len(payload) != expected_bytes or hashlib.sha256(payload).hexdigest() != expected_sha256:
              raise RuntimeError("embedded package part identity mismatch")
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              if stream.write(payload) != len(payload):
                  raise RuntimeError("short package part write")
              stream.flush()
              os.fsync(stream.fileno())
          stored = target.read_bytes()
          if len(stored) != expected_bytes or hashlib.sha256(stored).hexdigest() != expected_sha256:
              raise RuntimeError("package part readback mismatch")
          PY

