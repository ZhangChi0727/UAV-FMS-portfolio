name: B0 G3-A deterministic integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  real-loop:
    name: G3-A real loop (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            preset: b0-controller-debug
            module_dir: build/b0-controller/debug/03_control/b0
            artifact_suffix: debug
          - build_type: Release
            preset: b0-controller-release
            module_dir: build/b0-controller/release/03_control/b0
            artifact_suffix: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/b0-dev.txt
      - name: Install locked B0 development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/b0-dev.txt
      - name: Lint and run non-binding G3-A checks
        run: |
          python -m ruff check .
          python -m pytest -q tests
        working-directory: 05_integration/b0
      - name: Configure and build the requested real controller
        run: |
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}"
      - name: Run and retain the fixed real-component loop
        shell: bash
        run: |
          evidence_dir="${RUNNER_TEMP}/g3-bind-${{ matrix.artifact_suffix }}"
          mkdir -p "${evidence_dir}"
          B0_CONTROLLER_MODULE_DIR="${GITHUB_WORKSPACE}/${{ matrix.module_dir }}" \
          B0_CONTROLLER_BUILD_TYPE="${{ matrix.build_type }}" \
            python -m pytest -q \
            05_integration/b0/binding_checks/check_g3_bind_smoke.py \
            --junitxml="${evidence_dir}/g3-bind-${{ matrix.artifact_suffix }}.xml"
          python 05_integration/b0/runner.py \
            --g3-bind-smoke \
            --module-dir "${GITHUB_WORKSPACE}/${{ matrix.module_dir }}" \
            --build-type "${{ matrix.build_type }}" \
            --output "${evidence_dir}/g3-bind-${{ matrix.artifact_suffix }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: b0-g3-bind-${{ matrix.artifact_suffix }}
          path: ${{ runner.temp }}/g3-bind-${{ matrix.artifact_suffix }}
          if-no-files-found: error

  compare-real-loops:
    name: G3-A independent Debug Release comparison
    runs-on: ubuntu-latest
    needs: real-loop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/b0-dev.txt
      - name: Install locked B0 development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/b0-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: b0-g3-bind-*
          path: ${{ runner.temp }}/g3-bind
          merge-multiple: true
      - name: Compare independently generated traces
        run: >-
          python 05_integration/b0/binding_checks/compare_g3_bind_smoke.py
          --debug "${{ runner.temp }}/g3-bind/g3-bind-debug.json"
          --release "${{ runner.temp }}/g3-bind/g3-bind-release.json"
