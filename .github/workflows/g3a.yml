            --output "$G3A_EVIDENCE_ROOT/authority/debug-consumer-authority.json"
          )
          printf '%q ' "${bind_command[@]}" > "$G3A_EVIDENCE_ROOT/commands/debug-bind.command.txt"
          printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/debug-bind.command.txt"
          set +e
          "${bind_command[@]}" \
            > "$G3A_EVIDENCE_ROOT/authority/debug-bind-result.json" \
            2> "$G3A_EVIDENCE_ROOT/logs/debug-bind.log"
          bind_rc=$?
          set -e
          if [ "$bind_rc" -eq 0 ]; then
            verify_command=(
              /usr/bin/timeout --signal=TERM --kill-after=10s 120s
              "$G3A_VENV/bin/python" -I -B -X "pycache_prefix=$PYTHONPYCACHEPREFIX" -
              "$G3A_EVIDENCE_ROOT/authority/debug-bind-result.json"
              "$G3A_EVIDENCE_ROOT/authority/debug-consumer-authority.json"
              "$G3A_EVIDENCE_ROOT/authority/debug-consumer-authority-sha256.txt"
            )
            printf '%q ' "${verify_command[@]}" > "$G3A_EVIDENCE_ROOT/commands/debug-bind-verify.command.txt"
            printf '\n' >> "$G3A_EVIDENCE_ROOT/commands/debug-bind-verify.command.txt"
            set +e
            "${verify_command[@]}" \
                >> "$G3A_EVIDENCE_ROOT/logs/debug-bind.log" 2>&1 <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          reported_digest = result.get("consumer_authority_sha256")
          if result.get("status") != "TRANSPORT_BOUND_NOT_SEMANTICALLY_ACCEPTED":
              raise RuntimeError("unexpected bind status")
          if (
              not isinstance(reported_digest, str)
              or re.fullmatch(r"[0-9a-f]{64}", reported_digest) is None
          ):
              raise RuntimeError("bind result did not return a SHA-256")
          authority_bytes = Path(sys.argv[2]).read_bytes()
          actual_digest = hashlib.sha256(authority_bytes).hexdigest()
          if actual_digest != reported_digest:
              raise RuntimeError("bind result digest did not match consumer authority bytes")
          Path(sys.argv[3]).write_text(actual_digest + "\n", encoding="ascii")
          PY
            parse_rc=$?
            set -e
          else
            parse_rc=0
          fi
          rc=$bind_rc
          if [ "$rc" -eq 0 ]; then rc=$parse_rc; fi
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/debug-bind.exit-code.txt"
          exit "$rc"

