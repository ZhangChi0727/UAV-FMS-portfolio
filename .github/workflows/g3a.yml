          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          evidence_root = Path(sys.argv[1]).resolve(strict=True)
          source_root = Path(sys.argv[2]).resolve(strict=True)
          policy_path = Path(sys.argv[3]).resolve(strict=True)
          expected_policy_sha256 = sys.argv[4]
          hex40 = re.compile(r"[0-9a-f]{40}\Z")
          hex64 = re.compile(r"[0-9a-f]{64}\Z")

          def raw(path: Path) -> bytes:
              return path.read_bytes()

          def digest(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def document(path: Path) -> dict[str, object]:
              value = json.loads(raw(path).decode("utf-8"))
              if not isinstance(value, dict):
                  raise RuntimeError(f"expected object: {path}")
              return value

          def scalar(path: Path, pattern: re.Pattern[str]) -> str:
              value = raw(path).decode("ascii").strip()
              if pattern.fullmatch(value) is None:
                  raise RuntimeError(f"invalid scalar: {path}")
              return value

          def step_map(variable: str) -> dict[str, str]:
              result: dict[str, str] = {}
              for item in os.environ[variable].split(";"):
                  item = item.strip()
                  if not item:
                      continue
                  key, separator, value = item.partition("=")
                  if separator != "=" or not key or key in result:
                      raise RuntimeError(f"malformed {variable}")
                  result[key] = value
              return result

          outcomes = step_map("G3A_REQUIRED_STEP_OUTCOMES")
          conclusions = step_map("G3A_REQUIRED_STEP_CONCLUSIONS")
          if outcomes.keys() != conclusions.keys() or len(outcomes) != 40:
              raise RuntimeError("pre-DUT required-step set mismatch")
          for step_id in sorted(outcomes):
              if outcomes[step_id] != "success" or conclusions[step_id] != "success":
                  raise RuntimeError(f"required step was not successful: {step_id}")

          policy_raw = raw(policy_path)
          if digest(policy_raw) != expected_policy_sha256 or hex64.fullmatch(expected_policy_sha256) is None:
              raise RuntimeError("policy digest mismatch")
          policy = json.loads(policy_raw.decode("utf-8"))
          policy_paths = policy.get("source_paths")
          if not isinstance(policy_paths, list) or len(policy_paths) != 57 or len(set(policy_paths)) != 57:
              raise RuntimeError("policy source path set is not the accepted runtime57 set")

          checkout_head = scalar(evidence_root / "source/checkout-head.txt", hex40)
          checkout_tree = scalar(evidence_root / "source/checkout-tree.txt", hex40)
          event_head = scalar(evidence_root / "source/candidate-head.txt", hex40)
          workflow_commit = scalar(evidence_root / "source/github-workflow-sha.txt", hex40)
          if checkout_head != event_head:
              raise RuntimeError("checkout head is not the candidate head")
          workflow_bytes = raw(evidence_root / "source/actual-executing-workflow.yml")
          candidate_workflow_bytes = raw(evidence_root / "source/candidate-workflow.yml")
          current_candidate_workflow = raw(source_root / ".github/workflows/g3a.yml")
          workflow_digest = digest(workflow_bytes)
          if not (
              workflow_bytes == candidate_workflow_bytes == current_candidate_workflow
              and workflow_digest == scalar(
                  evidence_root / "source/actual-executing-workflow.sha256", hex64
              )
              and workflow_digest == scalar(
                  evidence_root / "source/candidate-workflow.sha256", hex64
              )
          ):
              raise RuntimeError("executing-workflow to candidate-workflow byte bridge failed")

          runner_manifest = evidence_root / "bootstrap/runner-platform-manifest.tsv"
          retained_runner_digest = scalar(
              evidence_root / "bootstrap/runner-platform-manifest.sha256", hex64
          )
          if digest(raw(runner_manifest)) != retained_runner_digest:
              raise RuntimeError("runner platform manifest digest mismatch")
          for line in raw(runner_manifest).decode("utf-8").splitlines():
              file_digest, separator, relative = line.partition("  ")
              if separator != "  " or hex64.fullmatch(file_digest) is None:
                  raise RuntimeError("malformed runner platform manifest")
              retained = (evidence_root / relative).resolve(strict=True)
              if not retained.is_relative_to(evidence_root) or digest(raw(retained)) != file_digest:
                  raise RuntimeError("runner platform fact mismatch")

          environment_facts_raw = raw(evidence_root / "environment-facts.json")
          summaries: dict[str, object] = {}
          for build_type, directory in (("Debug", "debug"), ("Release", "release")):
              root = evidence_root / "preflight" / directory
              state = document(root / "collection-state.json")
              basis_raw = raw(root / "authority-basis.json")
              basis = json.loads(basis_raw.decode("utf-8"))
              source_closure_raw = raw(root / "source-closure.json")
              source_closure = json.loads(source_closure_raw.decode("utf-8"))
              f0_raw = raw(root / "f0-candidate.json")
              f0 = json.loads(f0_raw.decode("utf-8"))
              build_raw = raw(evidence_root / "build-facts" / f"{directory}.json")
              build = json.loads(build_raw.decode("utf-8"))
              if not (
                  state.get("status") == "CI_POLICY_PREFLIGHT_PASS"
                  and state.get("phase") == "preflight"
                  and state.get("human_f0_accept") is False
                  and isinstance(state.get("ci"), dict)
                  and state.get("policy_sha256") == expected_policy_sha256
                  and state.get("source_commit") == checkout_head
                  and state.get("source_tree") == checkout_tree
              ):
                  raise RuntimeError(f"{build_type} CI preflight state mismatch")
              if basis.get("collection") != state or basis.get("policy_sha256") != expected_policy_sha256:
                  raise RuntimeError(f"{build_type} basis collection mismatch")
              identity = basis.get("identity")
              artifacts = basis.get("artifact_sha256")
              if not isinstance(identity, dict) or not isinstance(artifacts, dict):
                  raise RuntimeError(f"{build_type} basis structure mismatch")
              if not (
                  identity.get("source_commit") == checkout_head
                  and identity.get("source_tree") == checkout_tree
                  and identity.get("build_type") == build_type
                  and identity.get("source_closure_manifest_sha256") == digest(source_closure_raw)
                  and identity.get("f0_manifest_sha256") == digest(f0_raw)
                  and artifacts.get("external/environment-facts.json") == digest(environment_facts_raw)
              ):
                  raise RuntimeError(f"{build_type} basis identity mismatch")
              records = source_closure.get("files")
              if not isinstance(records, list) or {item.get("path") for item in records} != set(policy_paths):
                  raise RuntimeError(f"{build_type} policy57 source closure mismatch")
              workflow_records = [
                  item for item in records if item.get("path") == ".github/workflows/g3a.yml"
              ]
              if len(workflow_records) != 1 or workflow_records[0].get("sha256") != workflow_digest:
                  raise RuntimeError(f"{build_type} workflow source record mismatch")
              module = f0.get("module")
              execution = build.get("execution_evidence")
              if not isinstance(module, dict) or not isinstance(execution, dict):
                  raise RuntimeError(f"{build_type} build/module structure mismatch")
              if not (
                  f0.get("human_f0_accept") is False
                  and f0.get("source_commit") == checkout_head
                  and f0.get("source_tree") == checkout_tree
                  and f0.get("build_type") == build_type
                  and build.get("source_commit") == checkout_head
                  and build.get("source_tree") == checkout_tree
                  and build.get("build_type") == build_type
                  and execution.get("status") == "completed"
                  and execution.get("configure_exit_code") == 0
                  and execution.get("build_exit_code") == 0
                  and execution.get("process_receipt_status")
                  == "complete_known_process_tree_zero_connect_receipts"
                  and execution.get("network_connect_status")
                  == "zero_attempts_independently_reconstructed"
                  and identity.get("controller_module_sha256") == module.get("sha256")
                  and identity.get("controller_module_path") == module.get("path")
                  and identity.get("controller_module_abi") == module.get("abi")
              ):
                  raise RuntimeError(f"{build_type} build/module admission mismatch")
              summaries[directory] = {
                  "authority_basis_sha256": digest(basis_raw),
                  "build_facts_sha256": digest(build_raw),
                  "controller_module_path": module["path"],
                  "controller_module_sha256": module["sha256"],
                  "preflight_status": state["status"],
              }

          gate = {
              "schema_version": "b0-g3a-ci-predut-gate/v1",
              "status": "CI_PRE_DUT_GATE_PASS",
              "human_f0_accept": False,
              "dut_not_started_when_generated": True,
              "candidate": {"source_commit": checkout_head, "source_tree": checkout_tree},
              "workflow_bridge": {
                  "workflow_commit": workflow_commit,
                  "workflow_sha256": workflow_digest,
                  "candidate_sha256": workflow_digest,
              },
              "runner_platform_manifest_sha256": retained_runner_digest,
              "policy_sha256": expected_policy_sha256,
              "policy_source_path_count": len(policy_paths),
              "required_step_outcomes": outcomes,
              "required_step_conclusions": conclusions,
              "builds": summaries,
          }
          output = evidence_root / "authority/predut-gate.json"
          output.write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"status": gate["status"], "source_commit": checkout_head}))
          PY
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/predut-gate.exit-code.txt"
          exit "$rc"

