        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$G3A_EVIDENCE_ROOT/reports" "$G3A_EVIDENCE_ROOT/commands"
          outcomes_file="$G3A_EVIDENCE_ROOT/reports/step-outcomes.tsv"
          exit_file_report="$G3A_EVIDENCE_ROOT/reports/exit-file-status.tsv"
          closure_file="$G3A_EVIDENCE_ROOT/reports/workflow-closure.json"
          inventory_file="$G3A_EVIDENCE_ROOT/reports/artifact-inventory.sha256"
          packaging_file_report="$G3A_EVIDENCE_ROOT/reports/ci-step-packaging-status.tsv"
          printf 'step_id\toutcome\tconclusion\n' > "$outcomes_file"
          first_failed=''
          IFS=';' read -ra outcome_entries <<< "$G3A_ALL_STEP_OUTCOMES"
          IFS=';' read -ra conclusion_entries <<< "$G3A_ALL_STEP_CONCLUSIONS"
          if [ "${#outcome_entries[@]}" -ne 50 ] || [ "${#conclusion_entries[@]}" -ne 50 ]; then
            printf 'unexpected step cardinality\n' >&2
            exit 65
          fi
          for index in "${!outcome_entries[@]}"; do
            outcome_entry="${outcome_entries[$index]//[[:space:]]/}"
            conclusion_entry="${conclusion_entries[$index]//[[:space:]]/}"
            outcome_id="${outcome_entry%%=*}"
            outcome_value="${outcome_entry#*=}"
            conclusion_id="${conclusion_entry%%=*}"
            conclusion_value="${conclusion_entry#*=}"
            if [ "$outcome_id" != "$conclusion_id" ]; then
              printf 'outcome/conclusion identity mismatch\n' >&2
              exit 66
            fi
            printf '%s\t%s\t%s\n' "$outcome_id" "$outcome_value" "$conclusion_value" >> "$outcomes_file"
            if [ -z "$first_failed" ] && { [ "$outcome_value" != success ] || [ "$conclusion_value" != success ]; }; then
              first_failed="$outcome_id"
            fi
          done
          expected_exit_files=(
            workflow-fetch setup-python-provenance create-venv bootstrap python-bootstrap-baseline
            startup-admission catch2-clean
            environment-facts debug-prebuild debug-configure debug-configure.allowlist-check
            debug-configure.process-check debug-build debug-build.allowlist-check
            debug-build.process-check debug-build-facts debug-preflight release-prebuild
            release-configure release-configure.allowlist-check release-configure.process-check
            release-build release-build.allowlist-check release-build.process-check
            release-build-facts release-preflight predut-gate selected-regression basis-digests
            debug-driver debug-bind debug-offline release-driver release-bind release-offline compare
          )
          printf 'command_id\tpresence\texit_code\tsha256\n' > "$exit_file_report"
          for command_id in "${expected_exit_files[@]}"; do
            candidate="$G3A_EVIDENCE_ROOT/commands/$command_id.exit-code.txt"
            if [ -f "$candidate" ]; then
              exit_value="$(tr -d '\r\n' < "$candidate")"
              exit_digest="$(/usr/bin/sha256sum "$candidate" | /usr/bin/awk '{print $1}')"
              printf '%s\tpresent\t%s\t%s\n' "$command_id" "$exit_value" "$exit_digest" >> "$exit_file_report"
            else
              printf '%s\tabsent\t\t\n' "$command_id" >> "$exit_file_report"
            fi
          done
          expected_packaging_files=(
            bootstrap/ci-step-packaging/debug_configure/part-01.bin
            bootstrap/ci-step-packaging/debug_configure/part-02.bin
            bootstrap/ci-step-packaging/debug_configure/part-03.bin
            bootstrap/ci-step-packaging/debug_configure/readonly.sh
            bootstrap/ci-step-packaging/debug_configure/derivation.json
            bootstrap/ci-step-packaging/debug_build/part-01.bin
            bootstrap/ci-step-packaging/debug_build/part-02.bin
            bootstrap/ci-step-packaging/debug_build/part-03.bin
            bootstrap/ci-step-packaging/debug_build/readonly.sh
            bootstrap/ci-step-packaging/debug_build/derivation.json
            bootstrap/ci-step-packaging/debug_build_facts/part-01.bin
            bootstrap/ci-step-packaging/debug_build_facts/part-02.bin
            bootstrap/ci-step-packaging/debug_build_facts/part-03.bin
            bootstrap/ci-step-packaging/debug_build_facts/readonly.sh
            bootstrap/ci-step-packaging/debug_build_facts/derivation.json
            bootstrap/ci-step-packaging/release_configure/part-01.bin
            bootstrap/ci-step-packaging/release_configure/part-02.bin
            bootstrap/ci-step-packaging/release_configure/part-03.bin
            bootstrap/ci-step-packaging/release_configure/readonly.sh
            bootstrap/ci-step-packaging/release_configure/derivation.json
            bootstrap/ci-step-packaging/release_build/part-01.bin
            bootstrap/ci-step-packaging/release_build/part-02.bin
            bootstrap/ci-step-packaging/release_build/part-03.bin
            bootstrap/ci-step-packaging/release_build/readonly.sh
            bootstrap/ci-step-packaging/release_build/derivation.json
            bootstrap/ci-step-packaging/release_build_facts/part-01.bin
            bootstrap/ci-step-packaging/release_build_facts/part-02.bin
            bootstrap/ci-step-packaging/release_build_facts/part-03.bin
            bootstrap/ci-step-packaging/release_build_facts/readonly.sh
            bootstrap/ci-step-packaging/release_build_facts/derivation.json
          )
          printf 'relative_path\tpresence\tbytes\tsha256\n' > "$packaging_file_report"
          for relative_path in "${expected_packaging_files[@]}"; do
            candidate="$G3A_EVIDENCE_ROOT/$relative_path"
            if [ -f "$candidate" ]; then
              candidate_bytes="$(/usr/bin/stat --format='%s' "$candidate")"
              candidate_digest="$(/usr/bin/sha256sum "$candidate" | /usr/bin/awk '{print $1}')"
              printf '%s\tpresent\t%s\t%s\n' "$relative_path" "$candidate_bytes" "$candidate_digest" >> "$packaging_file_report"
            else
              printf '%s\tabsent\t\t\n' "$relative_path" >> "$packaging_file_report"
            fi
          done
          outcomes_digest="$(/usr/bin/sha256sum "$outcomes_file" | /usr/bin/awk '{print $1}')"
          exit_report_digest="$(/usr/bin/sha256sum "$exit_file_report" | /usr/bin/awk '{print $1}')"
          packaging_report_digest="$(/usr/bin/sha256sum "$packaging_file_report" | /usr/bin/awk '{print $1}')"
          if [ -n "$first_failed" ]; then
            closure_status='failed_or_partial'
            first_failed_json="\"$first_failed\""
          else
            closure_status='all_preupload_steps_successful'
            first_failed_json='null'
          fi
          printf '{\n  "schema_version": "b0-g3a-workflow-closure/v1",\n  "status": "%s",\n  "first_non_successful_step": %s,\n  "step_outcomes_sha256": "%s",\n  "exit_file_status_sha256": "%s",\n  "ci_step_packaging_status_sha256": "%s",\n  "upload_is_outside_this_non_recursive_closure": true\n}\n' \
            "$closure_status" "$first_failed_json" "$outcomes_digest" "$exit_report_digest" \
            "$packaging_report_digest" > "$closure_file"
          (
            cd "$G3A_EVIDENCE_ROOT"
            /usr/bin/find . -type f ! -path './reports/artifact-inventory.sha256' -print0 \
              | /usr/bin/sort -z \
              | /usr/bin/xargs -0 /usr/bin/sha256sum
          ) > "$inventory_file"

