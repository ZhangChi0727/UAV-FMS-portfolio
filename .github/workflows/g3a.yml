          set +e
          "${command[@]}" \
            > "$G3A_EVIDENCE_ROOT/logs/basis-digests.log" 2>&1 <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          arguments = list(map(Path, sys.argv[1:]))
          for source, output in zip(arguments[0::2], arguments[1::2]):
              output.write_text(
                  hashlib.sha256(source.read_bytes()).hexdigest() + "\n",
                  encoding="ascii",
              )
          print("candidate basis digests retained")
          PY
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$G3A_EVIDENCE_ROOT/commands/basis-digests.exit-code.txt"
