name: Requirements overview
on:
  push:
    paths: &inputs
      - README.md
      - requirements/*.sdoc
      - requirements/render_overview.py
      - overview.html
      - .github/workflows/requirements-overview.yml
  pull_request:
    paths: *inputs
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "markdown-it-py==4.3.0"
      - run: python requirements/render_overview.py --check
