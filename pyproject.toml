[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnc-baseline"
version = "1.0.0"
description = "Editable Python access to the GNC component checkout"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["gnc_baseline", "gnc_baseline.simulation", "gnc_baseline.estimation", "gnc_baseline.control", "gnc_baseline.integration"]

[tool.pytest.ini_options]
# For direct per-track pytest without installing the editable distribution.
pythonpath = ["."]
